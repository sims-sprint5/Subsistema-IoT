services:
  # ========== FastAPI ==========
  api:
    build: ./api
    container_name: iot-api
    restart: always
    env_file: .env
    ports:
      - "8088:8000"
    dns:
      - 8.8.8.8
      - 4.4.4.4
    networks:
      - sims_network

  # ======== Cloudflare Tunnel (Quick Tunnel) ========
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: iot-cloudflared
    command: tunnel --url http://api:8000
    depends_on:
      - api
    restart: unless-stopped

networks:
  sims_network:
    external: true
