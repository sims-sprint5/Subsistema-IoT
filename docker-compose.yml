services:
  # ========== FastAPI ==========
  api:
    build: ./api
    container_name: iot-api
    ports:
      - "8006:8000"
    env_file:
      - .env
    restart: unless-stopped

  # ======== Cloudflare Tunnel (Quick Tunnel) ========
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: iot-cloudflared
    command: tunnel --url http://api:8000
    depends_on:
      - api
    restart: unless-stopped
